# PostgreSQL solo para DESARROLLO local. En producción se usa el Postgres de Railway.
services:
  postgres:
    image: postgres:16
    container_name: ranch_texas_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ranch
      POSTGRES_PASSWORD: ranch
      POSTGRES_DB: ranch_texas
      TZ: America/Bogota
    ports:
      - "5432:5432"
    volumes:
      - ranch_pgdata:/var/lib/postgresql/data

volumes:
  ranch_pgdata:
